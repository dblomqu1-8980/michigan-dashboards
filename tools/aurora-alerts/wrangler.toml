name = "aurora-alerts"
main = "worker.js"
compatibility_date = "2026-07-01"

# Deliberately a separate Worker from up906-mdot-proxy. That one is a public
# read-only CORS proxy both dashboards depend on for live data; this one holds
# subscriber PII, an email-sending key, and a cron trigger. Keeping them apart
# means a bad deploy here cannot take the dashboards' data feeds down.

[[d1_databases]]
binding = "DB"
database_name = "aurora-alerts"
database_id = "2298fb19-130d-49cf-aaa3-f0e338ef657d"

# Two evening passes, 6 PM and 9 PM Eastern Daylight Time. The 18-hour
# cooldown in the code means the first favourable pass wins and the second is
# a no-op, so this is "check twice, send at most once a night".
# Cron is always UTC; these drift an hour in winter, which is acceptable.
[triggers]
crons = ["0 22 * * *", "0 1 * * *"]

[vars]
# Root-domain senders, matching the real IONOS mailboxes that exist at these
# addresses — so a reply to an alert lands somewhere a human reads rather than
# bouncing off a no-reply subdomain.
#
# Safe alongside the existing IONOS mail because Resend does not touch the root
# domain's mail records: it scopes its SPF and bounce MX to send.<domain> and
# uses a resend._domainkey DKIM selector, which cannot collide with IONOS's
# s1-ionos._domainkey / s2-ionos._domainkey. The root MX, root SPF and DMARC
# records stay exactly as they are.
SENDER_UP  = "UP Aurora Alerts <aurora@906dashboard.com>"
SENDER_NLP = "Up North Aurora Alerts <aurora@upnorthdashboard.com>"
